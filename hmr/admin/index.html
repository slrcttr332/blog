<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Panel HMR</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f3ead8;color:#2b1d12;padding-bottom:90px}
header{position:sticky;top:0;background:#2b1d12;color:#fff;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
header b{flex:1;min-width:100px}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:#b5541c;color:#fff;cursor:pointer;font-size:15px}
button.alt{background:#fff;color:#2b1d12}button.x{background:#a3261e}button.s{padding:6px 10px;background:#d9c7a3;color:#2b1d12}
main{max-width:760px;margin:auto;padding:12px}
fieldset,details{background:#fbf5e8;border:1px solid #d9c7a3;border-radius:8px;margin:0 0 12px;padding:12px}
summary{font-weight:700;cursor:pointer}legend{font-weight:700;padding:0 6px}
label{display:block;font-size:14px;font-weight:700;margin:8px 0 2px}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid #bda985;border-radius:6px;background:#fff}textarea{min-height:70px}
.it{border-top:2px dashed #d9c7a3;margin-top:12px;padding-top:6px}.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#msg{position:fixed;left:0;right:0;bottom:0;padding:14px;background:#2b1d12;color:#fff;margin:0;display:none}
#lg{display:none;max-width:420px;margin:12vh 16px;padding:20px;background:#fbf5e8;border:1px solid #d9c7a3;border-radius:10px}@media(min-width:460px){#lg{margin:12vh auto}}#lg h1{margin:0 0 6px;font-size:22px}#le{color:#a3261e;font-weight:700;min-height:1.5em}</style></head><body>
<div id="lg"><h1>Panel HMR</h1><p>Entra con tu token para editar la página.</p><div id="rpw"><label>Repositorio (usuario/repositorio)</label><input id="rp" autocomplete="off"></div><label>Token</label><input id="tk" type="password" autocomplete="off"><div class="row"><button id="go">Entrar</button></div><p id="le"></p></div>
<header id="hd" style="display:none"><b>Panel HMR</b><button id="pub">Publicar cambios</button><button class="alt" id="dl">Descargar JSON</button><button class="alt" id="out">Cerrar sesión</button></header>
<main id="m" style="display:none">Cargando…</main><p id="msg"></p>
<script>
let c;const $=i=>document.getElementById(i),open=new Set();
const S=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},W=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const say=(t,keep)=>{msg.style.display="block";msg.textContent=t;if(!keep)setTimeout(()=>msg.style.display="none",6000)};
const H=()=>({Authorization:"Bearer "+S("tok"),Accept:"application/vnd.github+json"});
const api=()=>`https://api.github.com/repos/${S("repo")}/contents/content.json`;
function F(o,k,label,area){const l=document.createElement("label");l.textContent=label;const i=document.createElement(area?"textarea":"input");i.value=o[k]||"";i.oninput=()=>o[k]=i.value;l.append(i);return l}
function B(txt,cls,fn){const b=document.createElement("button");b.textContent=txt;b.className=cls||"";b.onclick=fn;return b}
function mv(a,i,d){const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function render(){m.innerHTML="";
const lk=document.createElement("fieldset");lk.innerHTML="<legend>Enlaces</legend>";
[["registro","Registro estudiantil"],["canal","Canal Corazón de bruja"],["instagram","Instagram"],["zepeto_ninos","Zepeto niños"],["zepeto_ninas","Zepeto niñas"]].forEach(([k,l])=>lk.append(F(c.links,k,l)));m.append(lk);
const hf=document.createElement("fieldset");hf.innerHTML="<legend>Portada</legend>";hf.append(F(c.hero,"titulo","Título"),F(c.hero,"texto","Texto",1));m.append(hf);
c.sections.forEach((s,si)=>{const d=document.createElement("details");d.open=open.has(s);d.ontoggle=()=>d.open?open.add(s):open.delete(s);
d.innerHTML=`<summary>${(s.titulo||"Sin título").replace(/</g,"&lt;")}</summary>`;
d.append(F(s,"id","Identificador (sin espacios ni acentos)"),F(s,"titulo","Título"),F(s,"intro","Introducción",1));
s.items.forEach((it,ii)=>{const w=document.createElement("div");w.className="it";
w.append(F(it,"t","Nombre"),F(it,"d","Descripción",1),F(it,"h","Horario o etiqueta (opcional)"),F(it,"img","Imagen (ruta, ej. images/gringotts.webp)"));
const r=document.createElement("div");r.className="row";
r.append(B("↑","s",()=>mv(s.items,ii,-1)),B("↓","s",()=>mv(s.items,ii,1)),B("Quitar","x s",()=>{if(confirm("¿Quitar este elemento?")){s.items.splice(ii,1);render()}}));w.append(r);d.append(w)});
const r=document.createElement("div");r.className="row";
r.append(B("+ Elemento","alt",()=>{s.items.push({t:"",d:"",h:""});open.add(s);render()}),B("↑ Sección","s",()=>mv(c.sections,si,-1)),B("↓ Sección","s",()=>mv(c.sections,si,1)),B("Quitar sección","x s",()=>{if(confirm("¿Quitar la sección completa?")){c.sections.splice(si,1);render()}}));d.append(r);m.append(d)});
m.append(B("+ Agregar sección","",()=>{const s={id:"nueva",titulo:"Nueva sección",intro:"",items:[]};c.sections.push(s);open.add(s);render()}))}
const DEF_REPO="slrcttr332/HOGWARTS-MAGIC-REBELLION",DEF_BRANCH="main";
function view(ok){$("lg").style.display=ok?"none":"block";$("hd").style.display=ok?"flex":"none";m.style.display=ok?"block":"none"}
function logout(t){W("tok","");view(false);$("le").textContent=t||""}
const remote=(r,b,t)=>fetch(`https://api.github.com/repos/${r}/contents/content.json?ref=${b}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github.raw+json"}});
async function login(){const r=(DEF_REPO||$("rp").value).trim(),t=$("tk").value.trim();
if(!r||!t){$("le").textContent="Escribe el repositorio y el token.";return}
$("le").textContent="Verificando…";
try{const x=await remote(r,DEF_BRANCH,t);if(!x.ok)throw 0;c=await x.json();W("repo",r);W("branch",DEF_BRANCH);W("tok",t);$("tk").value="";$("le").textContent="";view(true);render()}
catch(e){$("le").textContent="No se pudo entrar. Revisa el repositorio y el token."}}
async function start(){if(DEF_REPO)$("rpw").style.display="none";
if(!S("tok")||!S("repo"))return view(false);
try{const x=await remote(S("repo"),S("branch")||"main",S("tok"));if(!x.ok)throw 0;c=await x.json();view(true);render()}catch(e){logout("Tu sesión caducó o el token ya no sirve. Vuelve a entrar.")}}
$("out").onclick=()=>logout("");$("go").onclick=login;
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,1)],{type:"application/json"}));a.download="content.json";a.click()};
$("pub").onclick=async()=>{if(!S("repo")||!S("tok"))return logout("Inicia sesión para publicar.");say("Publicando…",1);
try{const b=S("branch")||"main",g=await fetch(api()+"?ref="+b,{headers:H()});if(!g.ok)throw new Error("No se pudo leer el repositorio ("+g.status+"). Revisa repo, rama y token.");
const sha=(await g.json()).sha,body=btoa(unescape(encodeURIComponent(JSON.stringify(c,null,1))));
const p=await fetch(api(),{method:"PUT",headers:H(),body:JSON.stringify({message:"Actualiza contenido desde el panel",content:body,sha,branch:b})});
if(!p.ok)throw new Error("No se pudo guardar ("+p.status+"). El token necesita permiso de escritura en Contents.");
say("Publicado. La página se actualiza en 1 a 2 minutos.")}catch(e){say(e.message)}};
start();
</script></body></html>
