---
layout: default
---
<article class="post">
  <div class="post-hoja">
    <header class="post-cabecera">
      {% if page.mood %}<div class="mood" aria-hidden="true">{{ page.mood }}</div>{% endif %}
      <h1>{{ page.title }}</h1>
      <p class="meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{% include fecha.html fecha=page.date %}</time>
      </p>
      {% if page.tags.size > 0 %}
      <p class="etiquetas">
        {% for tag in page.tags %}<a class="etiqueta" href="{{ '/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>{% endfor %}
      </p>
      {% endif %}
    </header>
    {% if page.portada %}<img class="post-portada" src="{{ page.portada | relative_url }}" alt="{{ page.portada_alt | escape }}">{% endif %}
    <div class="texto">
      {{ content }}
    </div>
    <p class="volver"><a class="btn-enlace" href="{{ '/' | relative_url }}">Volver al inicio</a></p>
  </div>
</article>
